# !!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!
# Through out this whole github action there are two distinct flows that
# allows for releasing on npm & github OR github only.
# This allows for separation on public repositories and private ones
# without publishing release to npm.
# Job names are prefixed with [public] & [private] tags.
# The switch is based on top of conditional:
# if: ${{ env.IS_PRIVATE != 'true' }}
# and environment variable "IS_PRIVATE" set to `true` or `false`
# that can be defined inside Github's repository `Settings`
# !!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!
# Evaluates on push event if release is necessary and if so - create a release Pull Request
name: Push to release branches
on:
  push:
    branches: [master, next, alpha, beta]

env:
  IS_PRIVATE: ${{ vars.IS_PRIVATE }}
  USERNAME: ${{ github.actor }}
  SEMANTIC_VERSION: '19.0.5'

jobs:
  # Release with semantic-release an auto-merged branch to: Github repository, NPM, Github package registry
  release:
    name: Release to Github, GitHub Packages, NPM
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x]
        mongodb-version: ['7.0']

   # Skip releases triggered by semantic-release-bot to prevent loops
    if: >
      github.actor != 'semantic-release-bot' &&
      !contains(github.event.head_commit.message, 'chore(release):')

    permissions:
      packages: write
      contents: write
      issues: write
      pull-requests: write
    # Released version with semantic-release will use `semantic-release-bot` as
    # commit author and commit with message:
    #"chore(release): ${nextRelease.version} [skip ci]\n\n${nextRelease.notes}"
    # This is generated by `@semantic-release/git` in `.releaserc.json`

    steps:
      - name: ♻️ Display Environment
        run: echo "IS_PRIVATE=${{ env.IS_PRIVATE }}"

      - name: 🗄️ Start MongoDB(replica set)
        uses: supercharge/mongodb-github-action@1.12.0
        with:
          mongodb-version: "${{ matrix.mongodb-version }}"
          mongodb-db: eveble
          mongodb-replica-set: test-rs
          mongodb-port: 27017

      - name: ⏳ Wait for MongoDB to be ready
        run: |
          timeout 60 bash -c 'until docker exec mongodb mongosh --host localhost:27017 --eval "db.adminCommand({ping: 1})" > /dev/null 2>&1; do sleep 2; done'

      - name: 🔑 Create MongoDB admin user
        run: |
          docker exec mongodb mongosh --host localhost:27017 --eval "
            db = db.getSiblingDB('admin');
            db.createUser({
              user: 'admin',
              pwd: 'password',
              roles: [
                { role: 'root', db: 'admin' },
                { role: 'readWriteAnyDatabase', db: 'admin' }
              ]
            });
          "

      - name: 🔒 Verify MongoDB authentication
        run: |
          docker exec mongodb mongosh --host localhost:27017 -u admin -p password --authenticationDatabase admin --eval "db.adminCommand({ping: 1})"

      - name: 🟡 Verify replica set status
        run: |
          docker exec mongodb mongosh --host localhost:27017 -u admin -p password --authenticationDatabase admin --eval "rs.status()"

      - name: 🟢 Test connection from host
        run: |
          docker exec mongodb mongosh 'mongodb://admin:password@localhost:27017/eveble_testing?replicaSet=test-rs&authSource=admin&directConnection=true' --eval "db.runCommand({ping: 1})"


      - name: ⤵️ Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

        # !!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!
        # `Setup Node` - WILL DEFINE WHICH REGISTRY IS USED ON SEMANTIC
        # It does not care if you are using extra-plugin: @semantic-release/npm@9.0.2
        # If registry-url is defined to: 'https://npm.pkg.github.com/'
        # It will always try to publish the package on github AND NOT npm
        # On top of this issue:
        # IT WILL COMPLETELY ignore GH_TOKEN, GITHUB_TOKEN, NPM_TOKEN
        # IT will always use NODE_AUTH_TOKEN to define what will be used to
        # authenticate with the registry.
        # !!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!
      - name: ⚙️ Setup Node.js (Public - NPM Registry)
        if: env.IS_PRIVATE != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          registry-url: 'https://registry.npmjs.org'
          cache: 'yarn'

      - name: ⚙️ Setup Node.js (Private - GitHub Registry)
        if: env.IS_PRIVATE == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          registry-url: 'https://npm.pkg.github.com'
          cache: 'yarn'

      - name: 🚧 Install Dependencies
        run: yarn install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.EVEBLE_TYPES_AUTH_TOKEN }}


      - name: ✅ Run Tests
        run: yarn test
        env:
          NODE_ENV: test
          EVEBLE_COMMITSTORE_CLIENT: 'mongodb'
          EVEBLE_COMMITSTORE_MONGODB_URL: 'mongodb://admin:password@localhost:27017/eveble_testing?replicaSet=test-rs&authSource=admin&directConnection=true'
          EVEBLE_COMMITSTORE_MONGODB_DBNAME: 'eveble_testing'
          EVEBLE_SNAPSHOTTER_CLIENT: 'mongodb'
          EVEBLE_SNAPSHOTTER_MONGODB_URL: 'mongodb://admin:password@localhost:27017/eveble_testing?replicaSet=test-rs&authSource=admin&directConnection=true'
          EVEBLE_SNAPSHOTTER_MONGODB_DBNAME: 'eveble_testing'
          EVEBLE_COMMAND_SCHEDULER_CLIENT: 'pulse'
          EVEBLE_COMMAND_SCHEDULER_MONGODB_URL: 'mongodb://admin:password@localhost:27017/eveble_testing?replicaSet=test-rs&authSource=admin&directConnection=true'
          EVEBLE_COMMAND_SCHEDULER_MONGODB_DBNAME: 'eveble_testing'

      - name: 🏗️ Build Package
        run: yarn build

      - name: 🚀 Semantic Release (Public)
        if: env.IS_PRIVATE != 'true'
        uses: cycjimmy/semantic-release-action@v4
        id: public_semantic
        with:
          semantic_version: ${{ env.SEMANTIC_VERSION }}
          extra_plugins: |
            @semantic-release/changelog@6.0.3
            @semantic-release/git@10.0.1
            @semantic-release/npm@9.0.2
        env:
          # !!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!
          # NPM_TOKEN & GH_TOKEN _CAN_ be ignored by semantic-release
          # use NODE_AUTH_TOKEN if this action fails do to:
          # "EINVALIDNPMTOKEN Invalid npm token."
          # https://github.com/semantic-release/semantic-release/issues/2313
          # !!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: 🚀 Semantic Release (Private)
        if: env.IS_PRIVATE == 'true'
        uses: cycjimmy/semantic-release-action@v4
        id: private_semantic
        with:
          semantic_version: ${{ env.SEMANTIC_VERSION }}
          extra_plugins: |
            @semantic-release/changelog@6.0.3
            @semantic-release/git@10.0.1
            @semantic-release/npm@9.0.2
        env:
          # !!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!
          # NPM_TOKEN & GH_TOKEN _CAN_ be ignored, use NODE_AUTH_TOKEN
          # if this action fails do to: "EINVALIDNPMTOKEN Invalid npm token."
          # https://github.com/semantic-release/semantic-release/issues/2313
          # !!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check Release Status
        id: release_check
        run: |
          if [ "${{ steps.public_semantic.outputs.new_release_published }}" == "true" ] || [ "${{ steps.private_semantic.outputs.new_release_published }}" == "true" ]; then
            echo "released=true" >> $GITHUB_OUTPUT
            echo "version=${{ steps.public_semantic.outputs.new_release_version || steps.private_semantic.outputs.new_release_version }}" >> $GITHUB_OUTPUT
          fi

      - name: 🎉 Display Release Info
        if: steps.release_check.outputs.released == 'true'
        run: |
          echo "🎉 Released version: ${{ steps.release_check.outputs.version }}"
          echo "📦 Package: @${{ env.USERNAME }}"

      - name: 🔀 Setup Node.js for GitHub Packages
        if: steps.release_check.outputs.released == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          registry-url: 'https://npm.pkg.github.com'
          always-auth: true

      - name: 🎉 Publish to GitHub Packages
        if: steps.release_check.outputs.released == 'true'
        run: yarn publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 🚧 Install Documentation Dependencies
        run: |
          cd ./website
          yarn install --frozen-lockfile

      - name: 📄  Build Documentation
        run: yarn docs:build

      - name: Prepare GitHub Pages
        run: touch ./website/build/.nojekyll

      - name: 🤓 Deploy documentation to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./website/build
          publish_branch: gh-pages
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'



